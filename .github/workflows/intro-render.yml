name: Intro render

on:
  push:
    branches: [main]
    paths:
      - "tools/intro-render/**"
      - ".github/workflows/intro-render.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    # Windows, damit Consolas verwendet wird – exakt wie im Original.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r tools/intro-render/requirements.txt

      - name: Render intro
        run: python tools/intro-render/render.py

      - uses: actions/upload-artifact@v4
        with:
          name: bloom-intro
          path: tools/intro-render/output/

      - name: Update pre-release "intro-render"
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "intro-render"
          $files = Get-ChildItem tools/intro-render/output -File | ForEach-Object { $_.FullName }
          $notes = "Spike S3: Intro-Render aus bloom3d.py (MIT). Build $env:GITHUB_SHA"
          gh release view $tag 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag @files --prerelease --title "Intro-Render (Phase 0)" --notes $notes --target $env:GITHUB_SHA
          } else {
            gh release upload $tag @files --clobber
            gh release edit $tag --notes $notes
          }
